; LoGiX Base Fixture firmware
;   ESP-12F (ESP8266) fixture board:  envs usb / usb1m / ota / ota1m
;   WT32-ETH01 (ESP32 + Ethernet):    envs eth01 / eth01-ota
; Build:            pio run                      (default: usb)
; Flash over USB:   pio run -e usb -t upload          (COM12)
; Flash over WiFi:  pio run -e ota -t upload --upload-port <ip-or-hostname.local>
; WT32-ETH01:       pio run -e eth01 -t upload        (USB-serial adapter on TX0/RX0, IO0 to GND)
;                   pio run -e eth01-ota -t upload --upload-port <ip>
; Serial monitor:   pio device monitor -e usb

[platformio]
default_envs = usb

[env]
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags =
    ; IRremoteESP8266: only compile the NEC decoder (used by the common 24/44-key LED remotes)
    -D _IR_ENABLE_DEFAULT_=false
    -D DECODE_NEC=true
lib_deps =
    makuna/NeoPixelBus @ ^2.8.0
    crankyoldgit/IRremoteESP8266 @ ^2.8.6
    bblanchon/ArduinoJson @ ^7.2.0
    links2004/WebSockets @ ^2.6.1

[esp8266]
platform = espressif8266
board = esp12e
; 4 MB flash: 1 MB sketch slot (OTA-capable), 2 MB LittleFS for settings
board_build.ldscript = eagle.flash.4m2m.ld
monitor_filters = esp8266_exception_decoder, time
build_flags =
    ${env.build_flags}
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY

; WT32-ETH01. Arduino core 2.0.17 (platform 6.10.0) - the same core WLED runs on this board.
; Partition table = the layout found on the board under WLED (1.75 MB app slots, 60 KB LittleFS).
[eth01]
platform = espressif32 @ 6.10.0
board = wt32-eth01
board_build.partitions = partitions_eth01_4mb.csv
monitor_filters = esp32_exception_decoder, time
build_flags =
    ${env.build_flags}

[env:usb]
extends = esp8266
upload_port = COM12
monitor_port = COM12
upload_speed = 460800

; Some ESP-12 modules ship with 1 MB flash (e.g. GigaDevice ID c8 4014); a 4 MB image won't
; boot on them (the ROM stops at ets_main.c). Check with: esptool.py --port COM12 flash_id
[env:usb1m]
extends = esp8266
board = esp01_1m
; 1 MB flash: ~470 KB sketch slot (OTA still fits), 64 KB LittleFS for settings
board_build.ldscript = eagle.flash.1m64.ld
upload_port = COM12
monitor_port = COM12
; the first 1 MB board would not sync at 460800
upload_speed = 115200

[env:ota1m]
extends = esp8266
board = esp01_1m
board_build.ldscript = eagle.flash.1m64.ld
upload_protocol = custom
upload_port = logix-fixture.local
upload_command = curl --fail --show-error -F "firmware=@$SOURCE" http://$UPLOAD_PORT/api/update

[env:ota]
extends = esp8266
; Uploads the built firmware to the device's web updater.
; Override the target with:  --upload-port 192.168.1.50   (or  logix-fixture-xxxx.local)
upload_protocol = custom
upload_port = logix-fixture.local
upload_command = curl --fail --show-error -F "firmware=@$SOURCE" http://$UPLOAD_PORT/api/update

[env:eth01]
extends = eth01
upload_speed = 460800

[env:eth01-ota]
extends = eth01
upload_protocol = custom
upload_port = logix-fixture.local
upload_command = curl --fail --show-error -F "firmware=@$SOURCE" http://$UPLOAD_PORT/api/update
